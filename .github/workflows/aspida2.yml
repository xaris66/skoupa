name: Ασπίδα 2 — Χτίσιμο APK

# Αυτό το ΕΝΑ αρχείο αρκεί: την πρώτη φορά ξεπακετάρει τον κώδικα στον φάκελο aspida2/
# του repo (commit), τρέχει τις δοκιμές, χτίζει και ανεβάζει το APK στα Releases.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aspida2/**'
      - '.github/workflows/aspida2.yml'

permissions:
  contents: write

concurrency:
  group: aspida2
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 2.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ξεπακετάρισμα κώδικα (μόνο την πρώτη φορά)
        run: |
          if [ ! -d aspida2/app ]; then
            echo "$SOURCE_B64" | base64 -d | tar -xz
            git config user.name "xaris66"
            git config user.email "xaris66@users.noreply.github.com"
            git add aspida2
            git commit -m "Ασπίδα 2: πηγαίος κώδικας"
            git push
          fi
        env:
          SOURCE_B64: 

      - name: Public Suffix List
        run: |
          f=aspida2/app/src/main/assets/public_suffix_list.dat
          mkdir -p "$(dirname $f)"
          [ -s "$f" ] || curl -sSfL -o "$f" https://raw.githubusercontent.com/publicsuffix/list/main/public_suffix_list.dat
          wc -c "$f"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Δοκιμές πυρήνα (πραγματική εκτέλεση)
        run: |
          curl -sSfL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          unzip -q kc.zip -d kc
          kc/kotlinc/bin/kotlinc aspida2/app/src/main/java/gr/tkdkavala/aspida/core/*.kt aspida2/coretests/CoreTests.kt -include-runtime -d core.jar
          java -Dfile.encoding=UTF-8 -Dpsl=aspida2/app/src/main/assets/public_suffix_list.dat -Dout=core-test-results.txt -cp core.jar CoreTestsKt
          cat core-test-results.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Χτίσιμο APK (Gradle)
        run: gradle -p aspida2 assembleRelease --no-daemon --stacktrace

      - name: Υπογραφή APK
        env:
          KEYSTORE_B64: ${{ secrets.ASPIDA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ASPIDA_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            echo "::warning::Δεν βρέθηκε μόνιμο κλειδί (ASPIDA_KEYSTORE_BASE64). Προσωρινό κλειδί — οι ενημερώσεις πάνω από αυτή την έκδοση δεν θα δουλεύουν."
            KEYSTORE_PASS=temp123456
            keytool -genkeypair -keystore release.jks -alias aspida -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Aspida temp"
          fi
          IN=aspida2/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASS" --out Aspida2.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Aspida2.apk | tee sign-check.txt
          rm -f release.jks
          echo '### Υπογραφή' >> "$GITHUB_STEP_SUMMARY"; sed 's/^/    /' sign-check.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Ανέβασμα στα Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aspida2-v${{ env.VERSION_NAME }}
          name: Ασπίδα 2 — ${{ env.VERSION_NAME }}
          body: |
            Δοκιμαστική έκδοση Ασπίδας 2. Κατέβασε το Aspida2.apk και άνοιξέ το στο κινητό.
            Εγκαθίσταται ΔΙΠΛΑ στην παλιά Ασπίδα (δεν την αγγίζει).
          files: |
            Aspida2.apk
            core-test-results.txt
          make_latest: false
